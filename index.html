<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Parceiros Vertical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f8fb; --surface:#ffffff; --ink:#101828; --muted:#667085; --line:#e5e7eb;
  --blue:#2563eb; --blue2:#dbeafe; --green:#16a34a; --green2:#dcfce7; --red:#dc2626;
  --soft:#f1f5f9; --dark:#0f172a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --surface:#101827; --ink:#f8fafc; --muted:#a7b0c0; --line:#223047;
    --blue:#60a5fa; --blue2:#162a50; --green:#4ade80; --green2:#12301f; --soft:#172033; --dark:#020617;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#101827; --ink:#f8fafc; --muted:#a7b0c0; --line:#223047;
  --blue:#60a5fa; --blue2:#162a50; --green:#4ade80; --green2:#12301f; --soft:#172033; --dark:#020617;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}

/* Login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.card-login{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px 28px;box-shadow:0 10px 30px rgba(15,23,42,.06)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin-bottom:4px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:15px}
.card-login p{color:var(--muted);margin:0 0 24px;font-size:14px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=password],input[type=date],select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);outline:none}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:10px;border:1px solid transparent;background:var(--blue);color:#fff;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-block{width:100%;margin-top:22px}
.erro{color:var(--red);font-size:13px;margin-top:12px;min-height:18px}

/* App */
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .who{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
main{max-width:1200px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:20px 0}
.toolbar .f{display:flex;flex-direction:column;min-width:150px;flex:0 1 auto}
.toolbar .f label{margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.destaque{background:var(--green2);border-color:transparent}
.kpi.destaque .v{color:var(--green)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
.panel h2{font-size:15px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.grid2 .panel{margin-top:16px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.bars{display:flex;align-items:flex-end;gap:8px;height:200px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bar .col{width:100%;max-width:46px;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bar .col:hover{opacity:.85}
.bar .x{font-size:11px;color:var(--muted);margin-top:6px;white-space:nowrap}
.bar .t{font-size:11px;color:var(--muted);margin-bottom:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.vazio{color:var(--muted);text-align:center;padding:36px 0;font-size:14px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--blue2);color:var(--blue);font-size:12px;font-weight:600}
.share{display:flex;align-items:center;gap:8px;font-size:13px}
.share .trk{flex:1;height:6px;background:var(--soft);border-radius:3px;overflow:hidden;min-width:60px}
.share .trk i{display:block;height:100%;background:var(--blue)}
.foot{color:var(--muted);font-size:12px;margin-top:24px;text-align:center}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login">
  <form class="card-login" id="form-login" autocomplete="on">
    <div class="brand"><span class="brand-mark">V</span> Parceiros Vertical</div>
    <p>Acompanhe as reservas feitas com o seu cupom.</p>
    <label for="usuario">Usuário</label>
    <input id="usuario" type="text" autocomplete="username" autocapitalize="none" required>
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password" required>
    <button class="btn btn-block" id="btn-entrar" type="submit">Entrar</button>
    <div class="erro" id="erro-login"></div>
  </form>
</section>

<!-- APP -->
<section id="app" class="hidden">
  <header>
    <div class="top">
      <div class="brand"><span class="brand-mark">V</span> Parceiros Vertical</div>
      <div class="who"><span id="who-nome"></span><button class="btn btn-ghost" id="btn-sair" type="button">Sair</button></div>
    </div>
  </header>
  <main>
    <h1 id="titulo"></h1>
    <div class="sub" id="subtitulo"></div>

    <div class="toolbar">
      <div class="chips" id="chips-periodo"></div>
      <div class="f"><label for="dt-ini">De</label><input type="date" id="dt-ini"></div>
      <div class="f"><label for="dt-fim">Até</label><input type="date" id="dt-fim"></div>
      <div class="f hidden" id="f-parceiro"><label for="sel-parceiro">Parceiro</label><select id="sel-parceiro"></select></div>
    </div>

    <div class="kpis">
      <div class="kpi"><div class="l">Reservas confirmadas</div><div class="v" id="k-res">0</div><div class="s" id="k-pax"></div></div>
      <div class="kpi"><div class="l">Receita bruta</div><div class="v" id="k-rec">R$ 0</div><div class="s" id="k-ticket"></div></div>
      <div class="kpi destaque"><div class="l">Comissão</div><div class="v" id="k-com">R$ 0</div><div class="s" id="k-pct"></div></div>
    </div>

    <div class="grid2">
      <div class="panel">
        <h2>Receita bruta por mês</h2>
        <div id="grafico"></div>
      </div>
      <div class="panel" id="painel-lado">
        <h2 id="lado-titulo">Produtos</h2>
        <div id="lado"></div>
      </div>
    </div>

    <div class="panel">
      <h2>Reservas <span class="sub" id="cont-res" style="font-weight:400"></span></h2>
      <div class="tbl-wrap"><table id="tbl-res"></table></div>
    </div>

    <div class="foot" id="rodape"></div>
  </main>
</section>

<script>
(() => {
  const SESS = 'pv_sess';
  const fmtBRL = v => v.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
  const fmtInt = v => v.toLocaleString('pt-BR');
  const fmtData = s => s ? s.split('-').reverse().join('/') : '—';
  const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const sha256hex = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2,'0')).join('');

  // ─── Criptografia (espelha scripts/build_data.py) ─────────────────────────
  async function derivarChave(login, senha, iter) {
    const salt = (await crypto.subtle.digest('SHA-256', new TextEncoder().encode('pv-salt:' + login))).slice(0, 16);
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', hash:'SHA-256', salt, iterations: iter}, base,
      {name:'AES-GCM', length:256}, true, ['decrypt']);
  }
  async function baixar(login) {
    const arq = (await sha256hex('pv-file:' + login)).slice(0, 24) + '.json';
    const r = await fetch('data/' + arq + '?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) throw new Error('login');
    return r.json();
  }
  async function abrir(env, chave) {
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: b64(env.iv)}, chave, b64(env.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  // ─── Estado ───────────────────────────────────────────────────────────────
  let D = null, chaveAtual = null, loginAtual = null;
  const filtro = { ini: '', fim: '', parceiro: '', preset: 'ano' };

  // ─── Login ────────────────────────────────────────────────────────────────
  $('form-login').addEventListener('submit', async e => {
    e.preventDefault();
    const login = $('usuario').value.trim().toLowerCase();
    const senha = $('senha').value;
    $('erro-login').textContent = '';
    $('btn-entrar').disabled = true; $('btn-entrar').textContent = 'Entrando…';
    try {
      const env = await baixar(login);
      const chave = await derivarChave(login, senha, env.iter);
      D = await abrir(env, chave);
      chaveAtual = chave; loginAtual = login;
      try { sessionStorage.setItem(SESS, JSON.stringify({login, k: toB64(await crypto.subtle.exportKey('raw', chave))})); } catch (_) {}
      $('senha').value = '';
      iniciar();
    } catch (_) {
      $('erro-login').textContent = 'Usuário ou senha inválidos.';
    } finally {
      $('btn-entrar').disabled = false; $('btn-entrar').textContent = 'Entrar';
    }
  });

  $('btn-sair').addEventListener('click', () => {
    try { sessionStorage.removeItem(SESS); } catch (_) {}
    D = chaveAtual = loginAtual = null;
    $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  });

  async function restaurarSessao() {
    try {
      const s = JSON.parse(sessionStorage.getItem(SESS) || 'null');
      if (!s) return;
      const chave = await crypto.subtle.importKey('raw', b64(s.k), 'AES-GCM', true, ['decrypt']);
      D = await abrir(await baixar(s.login), chave);
      chaveAtual = chave; loginAtual = s.login;
      iniciar();
    } catch (_) { try { sessionStorage.removeItem(SESS); } catch (__) {} }
  }

  // Recarrega os dados a cada 5 min sem pedir senha
  setInterval(async () => {
    if (!chaveAtual) return;
    try { D = await abrir(await baixar(loginAtual), chaveAtual); render(); } catch (_) {}
  }, 5 * 60 * 1000);

  // ─── Períodos ─────────────────────────────────────────────────────────────
  const iso = d => d.toISOString().slice(0, 10);
  const PRESETS = [
    ['mes', 'Este mês', () => { const h = new Date(); return [iso(new Date(h.getFullYear(), h.getMonth(), 1, 12)), iso(h)]; }],
    ['mes_ant', 'Mês passado', () => { const h = new Date(); return [iso(new Date(h.getFullYear(), h.getMonth() - 1, 1, 12)), iso(new Date(h.getFullYear(), h.getMonth(), 0, 12))]; }],
    ['30d', 'Últimos 30 dias', () => { const h = new Date(); const i = new Date(h); i.setDate(h.getDate() - 29); return [iso(i), iso(h)]; }],
    ['ano', 'Este ano', () => { const h = new Date(); return [h.getFullYear() + '-01-01', iso(h)]; }],
    ['tudo', 'Tudo', () => [D.data_inicio, iso(new Date())]],
  ];
  function aplicarPreset(id) {
    const p = PRESETS.find(p => p[0] === id);
    [filtro.ini, filtro.fim] = p[2]();
    filtro.preset = id;
    $('dt-ini').value = filtro.ini; $('dt-fim').value = filtro.fim;
    render();
  }
  $('chips-periodo').innerHTML = PRESETS.map(p => `<button type="button" class="chip" data-p="${p[0]}">${p[1]}</button>`).join('');
  $('chips-periodo').addEventListener('click', e => { const p = e.target.dataset.p; if (p) aplicarPreset(p); });
  ['dt-ini', 'dt-fim'].forEach(id => $(id).addEventListener('change', () => {
    filtro.ini = $('dt-ini').value; filtro.fim = $('dt-fim').value; filtro.preset = ''; render();
  }));
  $('sel-parceiro').addEventListener('change', e => { filtro.parceiro = e.target.value; render(); });

  // ─── Render ───────────────────────────────────────────────────────────────
  function iniciar() {
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    $('who-nome').textContent = D.parceiro.nome;
    $('titulo').textContent = D.admin ? 'Todos os parceiros' : D.parceiro.nome;
    $('subtitulo').innerHTML = D.admin
      ? 'Visão administrativa da Vertical Rio'
      : 'Cupom ' + D.parceiro.cupons.map(c => `<span class="tag">${esc(c)}</span>`).join(' ');
    $('f-parceiro').classList.toggle('hidden', !D.admin);
    if (D.admin) {
      $('sel-parceiro').innerHTML = '<option value="">Todos</option>' +
        [...new Set(D.reservas.map(r => r.parceiro))].sort().map(n => `<option>${esc(n)}</option>`).join('');
    }
    aplicarPreset(filtro.preset || 'ano');
  }

  function render() {
    if (!D) return;
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.p === filtro.preset));
    const pct = D.comissao_pct / 100;
    const SEM = 'Sem parceiro';
    const com = r => r.parceiro === SEM ? 0 : r.valor * pct;
    const rs = D.reservas.filter(r => r.criado >= filtro.ini && r.criado <= filtro.fim &&
      (!filtro.parceiro || r.parceiro === filtro.parceiro));

    const receita = rs.reduce((s, r) => s + r.valor, 0);
    const pax = rs.reduce((s, r) => s + r.pax, 0);
    $('k-res').textContent = fmtInt(rs.length);
    $('k-pax').textContent = fmtInt(pax) + ' passageiros';
    $('k-rec').textContent = fmtBRL(receita);
    $('k-ticket').textContent = 'Ticket médio ' + fmtBRL(rs.length ? receita / rs.length : 0);
    $('k-com').textContent = fmtBRL(rs.reduce((s, r) => s + com(r), 0));
    $('k-pct').textContent = fmtInt(D.comissao_pct) + '% sobre a receita bruta';

    // Gráfico mensal
    const porMes = {};
    rs.forEach(r => { const m = r.criado.slice(0, 7); porMes[m] = (porMes[m] || 0) + r.valor; });
    const meses = [];
    if (filtro.ini && filtro.fim) {
      let [y, m] = filtro.ini.slice(0, 7).split('-').map(Number);
      const fim = filtro.fim.slice(0, 7);
      while (`${y}-${String(m).padStart(2,'0')}` <= fim && meses.length < 36) {
        meses.push(`${y}-${String(m).padStart(2,'0')}`); if (++m > 12) { m = 1; y++; }
      }
    }
    const max = Math.max(1, ...meses.map(m => porMes[m] || 0));
    const curto = v => v >= 1000 ? 'R$ ' + (v / 1000).toLocaleString('pt-BR', {maximumFractionDigits: 1}) + 'k' : fmtBRL(v);
    $('grafico').innerHTML = rs.length ? `<div class="bars">${meses.map(m => {
      const v = porMes[m] || 0, [y, mm] = m.split('-');
      return `<div class="bar" title="${MESES[+mm - 1]}/${y}: ${fmtBRL(v)}"><div class="t">${v ? curto(v) : ''}</div>
        <div class="col" style="height:${(v / max * 100).toFixed(1)}%"></div><div class="x">${MESES[+mm - 1]}${meses.length > 12 ? '/' + y.slice(2) : ''}</div></div>`;
    }).join('')}</div>` : '<div class="vazio">Nenhuma reserva no período.</div>';

    // Painel lateral: ranking de parceiros (admin) ou produtos (parceiro)
    const agrupar = campo => {
      const g = {};
      rs.forEach(r => { const k = r[campo]; g[k] = g[k] || {n: 0, v: 0, c: 0}; g[k].n++; g[k].v += r.valor; g[k].c += com(r); });
      return Object.entries(g).sort((a, b) => b[1].v - a[1].v);
    };
    const porParceiro = D.admin && !filtro.parceiro;
    $('lado-titulo').textContent = porParceiro ? 'Ranking de parceiros' : 'Produtos';
    const linhas = agrupar(porParceiro ? 'parceiro' : 'produto');
    $('lado').innerHTML = linhas.length ? `<div class="tbl-wrap"><table>
      <tr><th>${porParceiro ? 'Parceiro' : 'Produto'}</th><th class="num">Res.</th><th class="num">Receita</th>${porParceiro ? '<th class="num">Comissão</th>' : '<th>Part.</th>'}</tr>
      ${linhas.map(([k, g]) => `<tr${porParceiro ? ` class="click" data-parc="${esc(k)}"` : ''}><td>${esc(k)}</td><td class="num">${g.n}</td><td class="num">${fmtBRL(g.v)}</td>
        ${porParceiro ? `<td class="num">${k === SEM ? '—' : fmtBRL(g.c)}</td>` : `<td><div class="share"><div class="trk"><i style="width:${(g.v / receita * 100).toFixed(0)}%"></i></div>${(g.v / receita * 100).toFixed(0)}%</div></td>`}</tr>`).join('')}
    </table></div>` : '<div class="vazio">—</div>';

    // Tabela de reservas
    $('cont-res').textContent = rs.length ? `(${fmtInt(rs.length)})` : '';
    $('tbl-res').innerHTML = rs.length ? `<tr><th>Pedido</th><th>Reserva em</th><th>Data do voo</th>${D.admin ? '<th>Parceiro</th>' : ''}<th>Cupom</th><th>Produto</th><th class="num">PAX</th><th class="num">Valor</th><th class="num">Comissão</th></tr>` +
      rs.map(r => `<tr><td>${esc(r.n)}</td><td>${fmtData(r.criado)}</td><td>${fmtData(r.voo)}</td>${D.admin ? `<td>${esc(r.parceiro)}</td>` : ''}<td><span class="tag">${esc(r.cupom)}</span></td><td>${esc(r.produto)}</td>
        <td class="num">${r.pax}</td><td class="num">${fmtBRL(r.valor)}</td><td class="num">${r.parceiro === SEM ? '—' : fmtBRL(com(r))}</td></tr>`).join('')
      : '<tr><td class="vazio">Nenhuma reserva no período.</td></tr>';

    const g = new Date(D.gerado_em);
    $('rodape').textContent = `Reservas confirmadas no Rezdy · última atualização dos dados em ${g.toLocaleDateString('pt-BR')} às ${g.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})} · atualização automática a cada 15 min`;
  }

  $('lado').addEventListener('click', e => {
    const tr = e.target.closest('tr[data-parc]');
    if (tr) { filtro.parceiro = tr.dataset.parc; $('sel-parceiro').value = filtro.parceiro; render(); }
  });

  restaurarSessao();
})();
</script>
</body>
</html>
