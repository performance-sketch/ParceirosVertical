<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Parceiros — Vertical Rio</title>
<link rel="icon" href="https://pub-64ddf6587a154706980200c5e647bba8.r2.dev/vertical-rio-logo-black.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --ink:#0a0a0a; --ink2:#3f3f46; --muted:#71717a; --faint:#a1a1aa;
  --line:#e7e7ea; --soft:#f6f6f7; --red:#b42318; --green:#15803d;
  --radius:16px;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
.logo{display:block;height:46px;width:auto}
.num{font-variant-numeric:tabular-nums}

/* ── Login ───────────────────────────────────────────── */
#login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login-box{width:100%;max-width:380px}
.login-box .logo{height:72px;margin:0 auto 32px}
.card-login{border:1px solid var(--line);border-radius:var(--radius);padding:30px 26px}
.card-login h1{font:700 22px/1.2 "Inter Tight",Inter,sans-serif;margin:0 0 6px;letter-spacing:-.02em}
.card-login p{color:var(--muted);margin:0 0 22px;font-size:14px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=url],input[type=password],input[type=date],select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
input:focus,select:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(10,10,10,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn-dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn-dark:hover{background:#27272a}
.btn:disabled{opacity:.6;cursor:wait}
.btn-block{width:100%;margin-top:22px;padding:12px}
.erro{color:var(--red);font-size:13px;margin-top:12px;min-height:18px}
.login-foot{text-align:center;color:var(--faint);font-size:12px;margin-top:20px}

/* ── Header ──────────────────────────────────────────── */
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:10}
.top{display:flex;align-items:center;gap:20px;padding:16px 0;flex-wrap:wrap}
.top .t1{font-weight:700;font-size:16px}
.top .t2{display:flex;gap:20px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.top .t2 b{font-weight:500;color:var(--faint)}
.top .acoes{margin-left:auto;display:flex;gap:8px}
.ico{width:16px;height:16px}

/* ── Filtros ─────────────────────────────────────────── */
.filtros{border-bottom:1px solid var(--line);background:var(--soft)}
.filtros .wrap{display:flex;flex-wrap:wrap;gap:12px;padding-top:16px;padding-bottom:16px;align-items:flex-end}
.filtros .f{display:flex;flex-direction:column;min-width:170px;flex:1 1 170px;max-width:260px}
.filtros .f label{margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:500}

/* ── Hero ────────────────────────────────────────────── */
.hero{padding:64px 0 8px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.hero h1{font:800 clamp(30px,5vw,48px)/1.08 "Inter Tight",Inter,sans-serif;letter-spacing:-.035em;margin:14px 0 18px;max-width:860px}
.hero h1 .neg{color:var(--red)} .hero h1 .pos{color:var(--green)}
.hero .lead{font-size:17px;color:var(--ink2);max-width:640px;margin:0;line-height:1.6}

/* ── KPIs ────────────────────────────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin:48px 0 64px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr);gap:10px}}
.kpi{border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;min-width:0}
.kpi .l{font-size:13px;font-weight:500;color:var(--ink2);min-height:40px;line-height:1.5}
.kpi .v{font:700 32px/1.1 "Inter Tight",Inter,sans-serif;letter-spacing:-.03em;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v small{font:500 17px Inter,sans-serif;letter-spacing:0;margin-right:2px}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:600;margin-top:12px}
.delta.neg{color:var(--red)} .delta.pos{color:var(--green)} .delta.nul{color:var(--faint)}
.delta svg{width:12px;height:12px}
.kpi .vs{font-size:12px;color:var(--muted);margin-top:4px}
@media (max-width:640px){.kpi{padding:16px}.kpi .v{font-size:24px}.kpi .v small{font-size:14px}}

/* ── Seções ──────────────────────────────────────────── */
.sec-h{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.sec-h h2{font:700 22px/1.2 "Inter Tight",Inter,sans-serif;letter-spacing:-.02em;margin:0}
.tabs{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:10px;border:0;background:none;font-size:14px;font-weight:500;color:var(--ink2);cursor:pointer}
.tab.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--ink);font-weight:600}
section.bloco{margin-bottom:64px}

/* ── Ranking ─────────────────────────────────────────── */
.rank{display:flex;flex-direction:column;gap:12px}
.rk{display:grid;grid-template-columns:44px 52px 1fr auto 150px;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--radius);padding:18px 22px;cursor:pointer;background:#fff;text-align:left;width:100%}
.rk:hover{border-color:#c9c9cf}
.rk.top1{border-color:var(--ink)}
.rk .rkpos{font-weight:700;font-size:17px}
.rk .ini{font-weight:600;color:var(--faint);font-size:15px}
.rk .nm{font-weight:600;font-size:16px}
.rk .meta{font-size:13px;color:var(--ink2);margin-top:2px}
.rk .meta b{font-weight:600;letter-spacing:.03em}
.rk .part{font-size:14px;color:var(--ink2)}
.rk .val{text-align:right}
.rk .val .v{font:700 19px "Inter Tight",Inter,sans-serif;letter-spacing:-.02em;white-space:nowrap}
.rk .val .v small{font:500 13px Inter,sans-serif;margin-right:2px}
.rk .val .delta{margin-top:2px}
@media (max-width:640px){
  .rk{grid-template-columns:28px 1fr auto;padding:14px 16px;gap:10px}
  .rk .ini,.rk .part{display:none}
  .rk .val .v{font-size:16px}
}
.mais{display:flex;justify-content:center;margin-top:20px}

/* ── Gráfico de ciclos ───────────────────────────────── */
.chart{border:1px solid var(--line);border-radius:var(--radius);padding:24px 22px 16px}
.bars{display:flex;align-items:flex-end;gap:10px;height:220px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bar .col{width:100%;max-width:56px;background:#d4d4d8;border-radius:6px 6px 0 0;min-height:2px}
.bar.cur .col{background:var(--ink)}
.bar .t{font-size:12px;color:var(--ink2);margin-bottom:6px;white-space:nowrap;font-weight:500}
.bar .x{font-size:12px;color:var(--muted);margin-top:8px;white-space:nowrap}
.bar.cur .x{color:var(--ink);font-weight:600}
@media (max-width:640px){.bar .t{font-size:10px}.bars{gap:5px}}

/* ── Tabela ──────────────────────────────────────────── */
.tbl{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;background:var(--soft)}
td.r,th.r{text-align:right}
.code{font-weight:600;font-size:12px;letter-spacing:.04em;padding:3px 8px;border-radius:6px;background:var(--soft)}
.vazio{color:var(--muted);text-align:center;padding:40px 16px;font-size:14px}

/* ── Conquistas ──────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
@media (max-width:1000px){.stats{grid-template-columns:repeat(2,1fr);gap:10px}}
.stat{border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;min-width:0}
.stat .l{font-size:13px;font-weight:500;color:var(--ink2)}
.stat .v{font:700 24px/1.15 "Inter Tight",Inter,sans-serif;letter-spacing:-.02em;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v small{font:500 14px Inter,sans-serif;letter-spacing:0;margin-left:3px}
.stat .v small.pre{margin:0 2px 0 0}
.stat .s{font-size:12px;color:var(--muted);margin-top:4px}
.selos{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
@media (max-width:640px){.selos{grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:16px}.stat .v{font-size:20px}}
.selo{position:relative;border:1px solid var(--line);border-radius:var(--radius);padding:22px 16px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0}
.selo .md{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;margin-bottom:10px;font:800 17px "Inter Tight",Inter,sans-serif;letter-spacing:-.02em}
.selo .md svg{width:28px;height:28px}
.selo.off .md{background:var(--soft);color:var(--faint);box-shadow:inset 0 0 0 1px var(--line)}
.selo .nm{font-weight:600;font-size:14px;line-height:1.3}
.selo .ds{font-size:12px;color:var(--muted);line-height:1.4}
.selo .prog{width:100%;max-width:140px;height:5px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:8px}
.selo .prog i{display:block;height:100%;background:var(--ink);border-radius:999px}
.selo.novo{border-color:var(--ink)}
.selo .tag{position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:#fff;padding:3px 7px;border-radius:999px}
.dest{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.dst{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;background:#fff;cursor:pointer;text-align:left;width:100%;min-width:0}
.dst:hover{border-color:#c9c9cf}
.dst .md{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff}
.dst .md svg{width:20px;height:20px}
.dst .x{font-size:12px;color:var(--muted);font-weight:500}
.dst .nm{font-weight:600;font-size:15px}
.dst .s{font-size:13px;color:var(--ink2)}

/* ── Navegação Vendas / Conteúdos ────────────────────── */
.views{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px}
.modo{display:inline-block;font-size:11px;letter-spacing:.06em;padding:3px 9px;border-radius:999px;background:var(--ink);color:#fff;margin-right:8px;vertical-align:1px}

/* ── Conteúdos (Biblioteca de posts) ─────────────────── */
.addbox{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px}
.addbox .f,.ctool .f{display:flex;flex-direction:column;flex:1 1 170px;min-width:0}
.addbox .f.grow{flex:3 1 320px}
.addbox label{margin:0 0 6px}
.ctool{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px}
.ctool .f{max-width:240px}
.ctool label{margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:500}
.addmsg{font-size:13px;margin-top:10px;min-height:20px;color:var(--ink2)}
.addmsg.err{color:var(--red)} .addmsg.ok{color:var(--green)}
.pend{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.pg{border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.pg-top{display:flex;gap:6px 16px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;font-size:13px}
.pg-top a{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;min-width:0}
.pg-t{font-weight:600;color:var(--ink)}
.pg-t.err{color:var(--red)} .pg-t.ok{color:var(--green)}
.pg-bar{height:6px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:10px;position:relative}
.pg-bar i{display:block;height:100%;background:var(--ink);border-radius:999px;transition:width .8s ease}
.pg.ok .pg-bar i{background:var(--green)} .pg.err .pg-bar i{background:var(--red)}
.pg-bar.ind i{width:30%!important;position:absolute;animation:pg-ind 1.4s ease-in-out infinite}
@keyframes pg-ind{0%{left:-30%}100%{left:100%}}
@keyframes novo-post{0%,60%{box-shadow:0 0 0 3px var(--green)}100%{box-shadow:0 0 0 3px transparent}}
.pc.novo{animation:novo-post 3s ease-out}
@media (prefers-reduced-motion:reduce){.pg-bar i{transition:none}.pg-bar.ind i{animation:none;width:100%!important;opacity:.35}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
@media (max-width:640px){.cards{grid-template-columns:repeat(2,1fr);gap:10px}}
.pc{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;width:100%;min-width:0}
.pc:hover{border-color:#c9c9cf}
.th{aspect-ratio:4/5;background:var(--soft);position:relative;display:grid;place-items:center;color:var(--faint);overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th svg{width:32px;height:32px}
.chip{position:absolute;top:10px;left:10px;background:rgba(10,10,10,.82);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px}
.pc .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.pc .cr{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .mt{font-size:12px;color:var(--muted)}
.pc .lg{font-size:13px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em;margin-top:2px}
.pc .nums{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin-top:8px;color:var(--ink2)}
.pc .nums b{font-weight:600;color:var(--ink)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.st.ok::before{background:var(--green)} .st.err::before{background:var(--red)} .st.warn::before{background:#b45309}
.na{color:var(--faint)}
.mini{width:36px;height:36px;border-radius:8px;object-fit:cover;background:var(--soft);flex:none}
.ph{display:grid;place-items:center;color:var(--faint)} .ph svg{width:55%;height:55%}
.pcell{display:flex;align-items:center;gap:10px;max-width:300px;cursor:pointer}
.pcell span{overflow:hidden;text-overflow:ellipsis}
.ins{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
@media (max-width:640px){.ins{grid-template-columns:1fr}}
.insight{border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.insight .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.insight p{margin:6px 0 0;font-size:15px;line-height:1.5}
.nota{font-size:13px;color:var(--muted);margin:12px 0 0;line-height:1.5}
.rk .th44{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--soft);display:block}
.rk .nm.lim{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:520px}
#c-dlg{border:0;border-radius:20px;padding:0;width:min(780px,calc(100vw - 32px));max-height:calc(100vh - 48px);color:var(--ink);background:#fff}
#c-dlg::backdrop{background:rgba(10,10,10,.45)}
.dlg{padding:28px 28px 24px}
.dlg-h{display:flex;gap:18px;align-items:flex-start}
.dlg-h .th{width:96px;flex:none;border-radius:12px}
.dlg-h h3{font:700 22px/1.2 "Inter Tight",Inter,sans-serif;margin:0 0 8px;letter-spacing:-.02em}
.dlg-h .x{margin-left:auto;flex:none}
.dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px;margin:0}
.dl dt{color:var(--muted)} .dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0 8px}
.kv>div{border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.kv .l{font-size:12px;color:var(--muted)}
.kv .v{font:700 20px/1.2 "Inter Tight",Inter,sans-serif;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlg h4{font:700 16px "Inter Tight",Inter,sans-serif;margin:22px 0 10px}
.dlg-acoes{display:flex;justify-content:flex-end;margin-top:14px}
.btn-perigo{color:var(--red);border-color:#f1c7c3}
.btn-perigo:hover{background:#fdf3f2}
.leg{font-size:14px;color:var(--ink2);white-space:pre-line;margin:16px 0 0;max-height:120px;overflow:auto}
.hist{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:14px}
.hc{border:1px solid var(--line);border-radius:12px;padding:12px 14px 8px}
.hc .l{font-size:12px;color:var(--muted);font-weight:500}
.hc svg{display:block;width:100%;height:120px;overflow:visible;margin-top:4px}
@media (max-width:640px){.kv{grid-template-columns:repeat(2,1fr)}.dlg{padding:20px 16px}.dlg-h .th{width:72px}}

/* ── Painel do creator (painel.js) ───────────────────── */
:root{--volt:#d4ff3a;--noite:#0b0b0c;--noite2:#1c1c1f}
.pn{padding-top:28px}
.pn-sec{margin:0 0 48px;opacity:0;transform:translateY(12px);transition:opacity .5s ease,transform .5s ease}
.pn-sec.on{opacity:1;transform:none}
.pn-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.pn-h h2{font:700 22px/1.2 "Inter Tight",Inter,sans-serif;letter-spacing:-.02em;margin:0}
.pn-h .sub{font-size:13px;color:var(--muted)}
.pn-chips{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 8px;margin:0 -16px 14px;scrollbar-width:none}
.pn-chips::-webkit-scrollbar{display:none}
.chip-p{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip-p.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pn-datas{display:flex;gap:8px;margin:-6px 0 14px;flex-wrap:wrap}
.pn-datas input{max-width:180px}
.hero-pn{background:var(--noite);color:#fff;border-radius:24px;padding:24px 22px;position:relative;overflow:hidden}
.hero-pn .eb{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#a1a1aa}
.hero-pn .big{font:800 clamp(40px,11vw,64px)/1 "Inter Tight",Inter,sans-serif;letter-spacing:-.04em;margin:10px 0 4px;white-space:nowrap}
.hero-pn .big small{font-size:.42em;font-weight:600;letter-spacing:0;margin-right:4px;color:#d4d4d8}
.hero-pn .ganho{display:inline-flex;align-items:center;gap:8px;background:var(--volt);color:#0b0b0c;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;margin-top:10px}
.hero-pn .dl{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:#d4d4d8}
.hero-pn .dl b{color:#fff}
.hero-pn .delta{margin-top:0;vertical-align:middle}
.hero-pn .delta.pos{color:var(--volt)} .hero-pn .delta.neg{color:#fca5a5}
.pn-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
@media (min-width:760px){.pn-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.hero-pn{padding:32px 34px}}

<script>
(() => {
  const SESS = 'pv_sess';
  const SEM = 'Sem parceiro';
  const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const nBR = (v, d = 2) => v.toLocaleString('pt-BR', {minimumFractionDigits: d, maximumFractionDigits: d});
  const brl = v => 'R$ ' + nBR(v);
  const brlBig = v => `<small>R$</small>${nBR(v)}`;
  const int = v => v.toLocaleString('pt-BR');
  const pctTxt = v => v.toLocaleString('pt-BR', {maximumFractionDigits: 1}) + '%';
  const dBR = s => s ? s.split('-').reverse().join('/') : '—';
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const sha256hex = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, '0')).join('');
  const iniciais = n => n.split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase();
  const UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>';
  const DOWN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  const variacao = (a, b) => b ? (a - b) / b * 100 : null;
  const deltaHTML = v => v === null || !isFinite(v) ? '<span class="delta nul">—</span>'
    : `<span class="delta ${v < 0 ? 'neg' : 'pos'}">${v < 0 ? DOWN : UP}${v > 0 ? '+' : ''}${pctTxt(Math.round(v * 10) / 10)}</span>`;

  // ─── Criptografia (espelha scripts/build_data.py) ────────────────────────
  async function derivarChave(login, senha, iter) {
    const salt = (await crypto.subtle.digest('SHA-256', new TextEncoder().encode('pv-salt:' + login))).slice(0, 16);
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter}, base,
      {name: 'AES-GCM', length: 256}, true, ['decrypt']);
  }
  async function baixar(login) {
    const arq = (await sha256hex('pv-file:' + login)).slice(0, 24) + '.json';
    const r = await fetch('data/' + arq + '?t=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) throw new Error('login');
    return r.json();
  }
  async function abrir(env, chave) {
    const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(env.iv)}, chave, b64(env.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  // ─── Ciclos de análise: dia 26 do mês anterior a 25 do mês ───────────────
  const pad = n => String(n).padStart(2, '0');
  const isoD = (y, m, d) => new Date(Date.UTC(y, m - 1, d)).toISOString().slice(0, 10);
  const cicloDe = s => { let [y, m, d] = s.split('-').map(Number); if (d >= 26) { m++; if (m > 12) { m = 1; y++; } } return {y, m}; };
  const ciclo = (y, m) => ({id: `${y}-${pad(m)}`, y, m, ini: isoD(y, m - 1, 26), fim: isoD(y, m, 25), nome: `${MESES[m - 1]}/${y}`, curto: `${MESES[m - 1].slice(0, 3).toLowerCase()}/${String(y).slice(2)}`});
  const anterior = c => c.m === 1 ? ciclo(c.y - 1, 12) : ciclo(c.y, c.m - 1);
  const hoje = () => { const t = new Date(); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`; };
  function listaCiclos() {
    const a = cicloDe(D.data_inicio), b = cicloDe(hoje()), out = [];
    let c = ciclo(b.y, b.m);
    while (c.id >= `${a.y}-${pad(a.m)}` && out.length < 60) { out.push(c); c = anterior(c); }
    return out;
  }

  // ─── Estado ───────────────────────────────────────────────────────────────
  let D = null, chaveAtual = null, loginAtual = null;
  const F = {ciclo: '', ini: '', fim: '', parceiro: '', metrica: 'com', todos: false};

  // ─── Login / sessão ──────────────────────────────────────────────────────
  $('form-login').addEventListener('submit', async e => {
    e.preventDefault();
    const login = $('usuario').value.trim().toLowerCase();
    const senha = $('senha').value;
    $('erro-login').textContent = '';
    $('btn-entrar').disabled = true; $('btn-entrar').textContent = 'Entrando…';
    try {
      const env = await baixar(login);
      const chave = await derivarChave(login, senha, env.iter);
      D = await abrir(env, chave);
      chaveAtual = chave; loginAtual = login;
      try { sessionStorage.setItem(SESS, JSON.stringify({login, k: toB64(await crypto.subtle.exportKey('raw', chave))})); } catch (_) {}
      $('senha').value = '';
      iniciar();
    } catch (_) {
      $('erro-login').textContent = 'Usuário ou senha inválidos.';
    } finally {
      $('btn-entrar').disabled = false; $('btn-entrar').textContent = 'Entrar';
    }
  });
  $('btn-sair').addEventListener('click', () => {
    try { sessionStorage.removeItem(SESS); } catch (_) {}
    D = chaveAtual = loginAtual = null;
    F.ini = F.parceiro = '';
    $('app').classList.add('hidden'); $('login').classList.remove('hidden');
    window.scrollTo(0, 0);
  });
  // Depois de um envio, a página recarrega inteira (como Ctrl+Shift+R). O Pages ainda leva ~1 min para
  // publicar os dados novos, então por 3 min o portal lê direto do repositório pela API do GitHub.
  const FRESCO_KEY = 'pv_fresco_ate';
  const frescoAtivo = () => { try { return +sessionStorage.getItem(FRESCO_KEY) > Date.now(); } catch (_) { return false; } };
  function recarregarPagina(destaque) {
    try {
      sessionStorage.setItem(FRESCO_KEY, String(Date.now() + 180000));
      if (destaque) sessionStorage.setItem('pv_destaque', destaque);
    } catch (_) {}
    const u = new URL(location.href);
    u.searchParams.set('v', Date.now());   // URL nova: navegador busca página e scripts sem cache
    location.replace(u);
  }
  async function restaurarSessao() {
    try {
      const s = JSON.parse(sessionStorage.getItem(SESS) || 'null');
      if (!s) return;
      const chave = await crypto.subtle.importKey('raw', b64(s.k), 'AES-GCM', true, ['decrypt']);
      let env = null;
      if (frescoAtivo()) try { env = await baixarRepo(s.login); } catch (_) {}
      D = await abrir(env || await baixar(s.login), chave);
      chaveAtual = chave; loginAtual = s.login;
      iniciar();
    } catch (_) { try { sessionStorage.removeItem(SESS); } catch (__) {} }
  }
  // fresco=true lê direto do repositório pela API do GitHub (atualizado logo após o commit,
  // sem esperar a publicação do Pages); se a API não responder, usa o Pages.
  async function baixarRepo(login) {
    const arq = (await sha256hex('pv-file:' + login)).slice(0, 24) + '.json';
    // _= fura o cache de 60 s da API do GitHub (sem ele, o arquivo recém-publicado demora até 1 min para aparecer)
    const r = await fetch(`https://api.github.com/repos/performance-sketch/ParceirosVertical/contents/data/${arq}?ref=main&_=${Date.now()}`,
      {headers: {Accept: 'application/vnd.github.raw+json'}, cache: 'no-store'});
    if (!r.ok) throw new Error('api');
    return r.json();
  }
  async function recarregar(fresco = false) {
    if (!chaveAtual) return false;
    let env = null;
    if (fresco || frescoAtivo()) try { env = await baixarRepo(loginAtual); } catch (_) {}
    try { D = await abrir(env || await baixar(loginAtual), chaveAtual); render(); return true; } catch (_) { return false; }
  }
  setInterval(() => recarregar(), 5 * 60 * 1000);

  // ─── Abas Vendas / Conteúdos ─────────────────────────────────────────────
  const VIEW_KEY = 'pv_view';
  const VIEWS = ['painel', 'vendas', 'conteudos'];
  let VIEW = 'painel';
  try { VIEW = sessionStorage.getItem(VIEW_KEY) || 'painel'; } catch (_) {}
  function mostrarView(v) {
    VIEW = VIEWS.includes(v) ? v : 'painel';
    try { sessionStorage.setItem(VIEW_KEY, VIEW); } catch (_) {}
    document.querySelectorAll('#views .tab').forEach(t => t.classList.toggle('on', t.dataset.v === VIEW));
    $('v-vendas').classList.toggle('hidden', VIEW !== 'vendas');
    $('v-conteudos').classList.toggle('hidden', VIEW !== 'conteudos');
    $('v-painel').classList.toggle('hidden', VIEW !== 'painel');
    // Vendas e Painel compartilham os mesmos filtros (ciclo, De/Até e parceiro)
    $('btn-filtros').classList.toggle('hidden', VIEW === 'conteudos');
    if (VIEW === 'conteudos') $('painel-filtros').classList.add('hidden');
  }
  $('views').addEventListener('click', e => {
    const v = e.target.dataset.v; if (!v) return;
    mostrarView(v); render(); window.scrollTo(0, 0);
  });

  // ─── Filtros ──────────────────────────────────────────────────────────────
  $('btn-filtros').addEventListener('click', () => $('painel-filtros').classList.toggle('hidden'));
  $('sel-ciclo').addEventListener('change', e => { if (e.target.value) { usarCiclo(e.target.value); render(); } });
  ['dt-ini', 'dt-fim'].forEach(id => $(id).addEventListener('change', () => {
    if (!$('dt-ini').value || !$('dt-fim').value) return;
    F.ini = $('dt-ini').value; F.fim = $('dt-fim').value; F.ciclo = '';
    $('sel-ciclo').value = ''; render();
  }));
  $('sel-parceiro').addEventListener('change', e => { F.parceiro = e.target.value; render(); });
  $('tabs-rank').addEventListener('click', e => {
    const m = e.target.dataset.m; if (!m) return;
    F.metrica = m;
    document.querySelectorAll('#tabs-rank .tab').forEach(t => t.classList.toggle('on', t.dataset.m === m));
    render();
  });
  ['rank', 'dest'].forEach(id => $(id).addEventListener('click', e => {
    const b = e.target.closest('[data-parc]'); if (!b) return;
    F.parceiro = b.dataset.parc; $('sel-parceiro').value = F.parceiro; render();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }));
  $('mais').addEventListener('click', e => { if (e.target.closest('button')) { F.todos = !F.todos; render(); } });

  function usarCiclo(id) {
    const cs = listaCiclos();
    const c = cs.find(c => c.id === id) || cs[1] || cs[0];  // padrão: último ciclo fechado
    F.ciclo = c.id; F.ini = c.ini; F.fim = c.fim;
    $('sel-ciclo').value = c.id; $('dt-ini').value = c.ini; $('dt-fim').value = c.fim;
  }

  // ─── Cálculos ─────────────────────────────────────────────────────────────
  const comissao = r => r.parceiro === SEM ? 0 : r.valor * D.comissao_pct / 100;
  const doPeriodo = (ini, fim) => D.reservas.filter(r => r.criado >= ini && r.criado <= fim &&
    (!F.parceiro || r.parceiro === F.parceiro));
  function resumo(rs) {
    const pagas = rs.filter(r => r.parceiro !== SEM);
    const com = pagas.reduce((s, r) => s + comissao(r), 0);
    return {
      com, res: pagas.length,
      receita: pagas.reduce((s, r) => s + r.valor, 0),
      pax: pagas.reduce((s, r) => s + r.pax, 0),
      parceiros: new Set(pagas.map(r => r.parceiro)).size,
      cpr: pagas.length ? com / pagas.length : 0,
    };
  }
  function periodoAnterior() {
    if (F.ciclo) { const a = anterior(listaCiclos().find(c => c.id === F.ciclo)); return {ini: a.ini, fim: a.fim, nome: a.nome}; }
    const d0 = new Date(F.ini + 'T12:00:00Z'), d1 = new Date(F.fim + 'T12:00:00Z');
    const dias = Math.round((d1 - d0) / 864e5) + 1;
    const fim = new Date(d0 - 864e5), ini = new Date(fim - (dias - 1) * 864e5);
    return {ini: ini.toISOString().slice(0, 10), fim: fim.toISOString().slice(0, 10), nome: 'período anterior'};
  }

  // ─── Render ───────────────────────────────────────────────────────────────
  function iniciar() {
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    $('h-titulo').textContent = D.admin ? 'Ranking Parceiros' : D.parceiro.nome;
    $('sel-ciclo').innerHTML = listaCiclos().map((c, i) => `<option value="${c.id}">${c.nome}${i === 0 ? ' (em andamento)' : ''}</option>`).join('') +
      '<option value="">Período personalizado</option>';
    $('f-parceiro').classList.toggle('hidden', !D.admin);
    $('bloco-ranking').classList.toggle('hidden', !D.admin);
    if (D.admin) {
      const nomes = [...new Set([...(D.parceiros || []).map(p => p.nome), ...D.reservas.map(r => r.parceiro)])].filter(n => n !== SEM).sort((a, b) => a.localeCompare(b, 'pt-BR'));
      $('sel-parceiro').innerHTML = '<option value="">Todos os parceiros</option>' + nomes.map(n => `<option>${esc(n)}</option>`).join('');
    }
    if (!F.ini) usarCiclo('');
    mostrarView(VIEW);
    render();
  }

  function render() {
    if (!D) return;
    const rs = doPeriodo(F.ini, F.fim);
    const ant = periodoAnterior();
    const rsAnt = doPeriodo(ant.ini, ant.fim);
    const A = resumo(rs), B = resumo(rsAnt);
    const cs = listaCiclos();
    const c = F.ciclo ? cs.find(x => x.id === F.ciclo) : null;
    const emAndamento = c && c.id === cs[0].id;
    const vs = c ? `vs ${ant.nome}` : 'vs período anterior';
    const quem = D.admin ? (F.parceiro || null) : D.parceiro.nome;
    const infoParc = D.admin ? (D.parceiros || []).find(p => p.nome === F.parceiro) : D.parceiro;
    const geral = D.admin && !quem;
    const unidade = c ? 'ciclo' : 'período';

    // Header
    $('h-ciclo').textContent = c ? `Ciclo de Análise · ${c.nome}` : `Período · ${dBR(F.ini)} – ${dBR(F.fim)}`;
    const g = new Date(D.gerado_em);
    $('h-atualizado').textContent = `Atualizado em ${g.toLocaleDateString('pt-BR')} às ${g.toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'})}`;

    // Hero
    $('eyebrow').textContent = (c ? `Ciclo de análise · ${c.nome} · ` : 'Período · ') + `${dBR(F.ini)} – ${dBR(F.fim)}` + (emAndamento ? ' · em andamento' : '');
    const v = variacao(A.com, B.com);
    const sujeito = geral ? null : (D.admin ? esc(quem) + ' gerou' : 'Você gerou');
    let h;
    if (!A.res) h = `Nenhuma reserva comissionada neste ${unidade}.`;
    else if (geral && v !== null) h = `${emAndamento ? 'O ciclo apresenta' : `O ${unidade} apresentou`} <span class="${v < 0 ? 'neg' : 'pos'}">${v < 0 ? 'retração' : 'crescimento'} de ${int(Math.round(Math.abs(v)))}%</span> nas comissões pagáveis.`;
    else if (geral) h = `<span class="pos">${brl(A.com)}</span> em comissões pagáveis neste ${unidade}.`;
    else if (v === null) h = `${sujeito} <span class="pos">${brl(A.com)}</span> em comissões neste ${unidade}.`;
    else h = `${sujeito} <span class="pos">${brl(A.com)}</span> em comissões, <span class="${v < 0 ? 'neg' : 'pos'}">${v < 0 ? '−' : '+'}${int(Math.round(Math.abs(v)))}%</span> ${vs}.`;
    $('headline').innerHTML = h;

    const rank = ranking(rs, rsAnt);
    if (geral) {
      $('lead').textContent = rank.length
        ? `${[...rank].sort((a, b) => b.com - a.com)[0].nome} lidera o ranking · ${brl(A.com)} a pagar entre ${A.parceiros} parceiro${A.parceiros === 1 ? '' : 's'} · ${brl(A.receita)} em vendas com cupom.`
        : 'Sem vendas com cupom de parceiros no período.';
    } else {
      const cup = infoParc && infoParc.cupons.length ? `com o cupom ${infoParc.cupons.join(', ')}` : 'atribuída' + (A.res === 1 ? '' : 's') + (D.admin ? '' : ' a você');
      $('lead').textContent = `${int(A.res)} reserva${A.res === 1 ? '' : 's'} confirmada${A.res === 1 ? '' : 's'} ${cup} · ${brl(A.receita)} em vendas · comissão de ${pctTxt(D.comissao_pct)} sobre a receita bruta.`;
    }

    // KPIs
    const K = geral ? [
      ['Comissões Pagáveis', brlBig(A.com), variacao(A.com, B.com)],
      ['Reservas Comissionadas', int(A.res), variacao(A.res, B.res)],
      ['Parceiros Comissionados', int(A.parceiros), variacao(A.parceiros, B.parceiros)],
      ['Comissão Média por Reserva', brlBig(A.cpr), variacao(A.cpr, B.cpr)],
      ['Receita Bruta com Cupom', brlBig(A.receita), variacao(A.receita, B.receita)],
    ] : [
      ['Comissão', brlBig(A.com), variacao(A.com, B.com)],
      ['Reservas Confirmadas', int(A.res), variacao(A.res, B.res)],
      ['Passageiros', int(A.pax), variacao(A.pax, B.pax)],
      ['Comissão Média por Reserva', brlBig(A.cpr), variacao(A.cpr, B.cpr)],
      ['Receita Bruta', brlBig(A.receita), variacao(A.receita, B.receita)],
    ];
    $('kpis').innerHTML = K.map(([l, val, d]) => `<div class="kpi"><div class="l">${l}</div><div class="v num">${val}</div>${deltaHTML(d)}<div class="vs">${vs}</div></div>`).join('');

    if (D.admin) renderRanking(rank);
    $('bloco-conq').classList.toggle('hidden', geral);
    $('bloco-destaques').classList.toggle('hidden', !geral);
    if (geral) renderDestaques(); else renderConquistas(D.admin ? quem : null);
    renderCiclos();

    // Tabela
    $('cont-res').textContent = rs.length ? `${int(rs.length)} no ${unidade}` : '';
    $('tbl-res').innerHTML = rs.length
      ? `<tr><th>Pedido</th><th>Reserva em</th><th>Data do voo</th>${geral ? '<th>Parceiro</th>' : ''}<th>Cupom</th><th>Produto</th><th class="r">PAX</th><th class="r">Valor</th><th class="r">Comissão</th></tr>` +
        rs.map(r => `<tr><td>${esc(r.n)}</td><td class="num">${dBR(r.criado)}</td><td class="num">${dBR(r.voo)}</td>${geral ? `<td>${esc(r.parceiro)}</td>` : ''}<td>${r.cupom === 'PEDIDO' ? '<span style="color:var(--muted)">pedido</span>' : `<span class="code">${esc(r.cupom)}</span>`}</td><td>${esc(r.produto)}</td>
          <td class="r num">${r.pax}</td><td class="r num">${brl(r.valor)}</td><td class="r num">${r.parceiro === SEM ? '—' : brl(comissao(r))}</td></tr>`).join('')
      : '<tr><td class="vazio">Nenhuma reserva no período.</td></tr>';

    $('rodape').textContent = D.admin ? 'Uso interno · Ranking Parceiros' : 'Portal de Parceiros · Vertical Rio';
    if (VIEW === 'conteudos' && window.PVC) window.PVC.render();
    if (VIEW === 'painel' && window.PVP) window.PVP.render();
  }

  function ranking(rs, rsAnt) {
    const agr = lista => {
      const g = {};
      lista.filter(r => r.parceiro !== SEM).forEach(r => {
        const k = r.parceiro || D.parceiro.nome;
        g[k] = g[k] || {nome: k, com: 0, res: 0, receita: 0, cupons: new Set()};
        g[k].com += comissao(r); g[k].res++; g[k].receita += r.valor; g[k].cupons.add(r.cupom === 'PEDIDO' ? r.n : r.cupom);
      });
      return g;
    };
    const atual = agr(rs), ant = agr(rsAnt);
    const total = Object.values(atual).reduce((s, x) => s + x.com, 0);
    return Object.values(atual).map(x => {
      const p = ant[x.nome] || {com: 0, res: 0};
      return {...x, cpr: x.res ? x.com / x.res : 0, part: total ? x.com / total * 100 : 0,
        antCom: p.com, antRes: p.res, antCpr: p.res ? p.com / p.res : 0};
    });
  }

  function renderRanking(rank) {
    const M = F.metrica;
    const ord = [...rank].sort((a, b) => (M === 'res' ? b.res - a.res : M === 'cpr' ? b.cpr - a.cpr : b.com - a.com));
    const total = ord.length, vis = F.todos ? ord : ord.slice(0, 5);
    const tipoDe = n => ((D.parceiros || []).find(p => p.nome === n) || {}).tipo || 'Parceiro';
    $('rank').innerHTML = total ? vis.map((x, i) => {
      let val, d;
      if (M === 'res') { val = `${int(x.res)} <small>reserva${x.res === 1 ? '' : 's'}</small>`; d = variacao(x.res, x.antRes); }
      else if (M === 'cpr') { val = brlBig(x.cpr); d = variacao(x.cpr, x.antCpr); }
      else if (M === 'part') { val = pctTxt(Math.round(x.part * 10) / 10); d = null; }
      else { val = brlBig(x.com); d = variacao(x.com, x.antCom); }
      return `<button type="button" class="rk${i === 0 ? ' top1' : ''}" data-parc="${esc(x.nome)}">
        <span class="rkpos">${i + 1}</span><span class="ini">${esc(iniciais(x.nome))}</span>
        <span><div class="nm">${esc(x.nome)}</div><div class="meta">${esc(tipoDe(x.nome))} · <b>${esc([...x.cupons].join(', '))}</b></div></span>
        <span class="part num">${pctTxt(Math.round(x.part * 10) / 10)}</span>
        <span class="val"><div class="v num">${val}</div>${M === 'part' ? '' : deltaHTML(d)}</span>
      </button>`;
    }).join('') : '<div class="vazio">Nenhum parceiro com reservas no período.</div>';
    $('mais').innerHTML = total > 5 ? `<button type="button" class="btn">${F.todos ? 'Mostrar menos' : `Ver todos os ${total} parceiros`}</button>` : '';
  }

  // ─── Conquistas: sempre sobre todo o histórico, independente do filtro ────
  const METAS = [5000, 10000, 25000, 50000];
  const SVG = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  const ICO = {
    estrela: SVG('<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>'),
    trofeu: SVG('<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"/>'),
    ticket: SVG('<path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"/><path d="M15 7v2M15 11v2M15 15v2"/>'),
    chama: SVG('<path d="M12 3c.5 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.4 1.3-3.6 2-5 .8 1.3 1.6 2 2 2-.4-2.6.1-5 1-7z"/>'),
    coroa: SVG('<path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/>'),
  };
  const cicloId = s => { const {y, m} = cicloDe(s); return `${y}-${pad(m)}`; };
  const ord = n => n + 'º';

  // nomeSel: parceiro escolhido pelo admin; null = o próprio parceiro logado
  function conquistas(nomeSel) {
    const minhas = D.reservas.filter(r => r.parceiro !== SEM && (!nomeSel || r.parceiro === nomeSel))
      .sort((a, b) => a.criado.localeCompare(b.criado));
    const por = {};
    minhas.forEach(r => { const c = por[cicloId(r.criado)] ||= {receita: 0, res: 0}; c.receita += r.valor; c.res++; });
    const serie = listaCiclos().reverse().map(c => ({...c, receita: por[c.id]?.receita || 0, res: por[c.id]?.res || 0}));
    const atual = serie[serie.length - 1];

    let acc = 0; const quando = {};
    minhas.forEach(r => { acc += r.valor; METAS.forEach(m => { if (acc >= m && !quando[m]) quando[m] = r.criado; }); });

    // Recorde pessoal: melhor ciclo e quantas vezes um ciclo superou todos os anteriores
    const recorde = campo => {
      let melhor = null, quebras = 0;
      serie.forEach(c => {
        if (!c[campo]) return;
        if (melhor && c[campo] > melhor[campo]) quebras++;
        if (!melhor || c[campo] > melhor[campo]) melhor = c;
      });
      return {melhor, quebras};
    };
    const recFat = recorde('receita'), recRes = recorde('res');

    // Sequência de ciclos com venda; o ciclo em andamento ainda sem venda não quebra a sequência
    let seq = 0, melhorSeq = 0, seqAtual = 0;
    serie.forEach(c => { seq = c.res ? seq + 1 : 0; melhorSeq = Math.max(melhorSeq, seq); });
    for (let i = serie.length - (atual.res ? 1 : 2); i >= 0 && serie[i].res; i--) seqAtual++;

    const RC = D.ranking_ciclos || {};
    const posDe = id => {
      const x = RC[id]; if (!x) return null;
      if (!Array.isArray(x)) return x;
      const p = x.indexOf(nomeSel); return p < 0 ? null : {pos: p + 1, total: x.length};
    };
    const destaques = serie.filter(c => c !== atual && posDe(c.id)?.pos === 1);

    return {total: acc, primeira: minhas[0]?.criado, quando, recFat, recRes, seqAtual, melhorSeq, destaques, atual, posAtual: posDe(atual.id)};
  }

  function renderConquistas(nomeSel) {
    const C = conquistas(nomeSel), A = C.atual;
    const selo = (ico, nm, ok, ds, prog = null, novo = false) => ({ico, nm, ok, ds, prog, novo});
    const recSelo = (rec, ico, nm, fmt, campo) => {
      const m = rec.melhor;
      if (rec.quebras) return selo(ico, nm, true, `${fmt(m[campo])} em ${m.nome}`, null, m === A);
      if (!m) return selo(ico, nm, false, 'Venda em dois ciclos e supere o primeiro');
      return selo(ico, nm, false, `Supere ${fmt(m[campo])} (${m.nome})`, m === A ? null : A[campo] / m[campo]);
    };
    const S = [
      selo(ICO.estrela, 'Primeira venda', !!C.primeira, C.primeira ? `Em ${dBR(C.primeira)}` : 'A primeira reserva confirmada com cupom'),
      ...METAS.map(m => selo(`${m / 1000}k`, `R$ ${int(m / 1000)} mil em vendas`, !!C.quando[m],
        C.quando[m] ? `Alcançado em ${dBR(C.quando[m])}` : `${brl(C.total)} de ${brl(m)}`, C.quando[m] ? null : C.total / m)),
      recSelo(C.recFat, ICO.trofeu, 'Recorde de faturamento', brl, 'receita'),
      recSelo(C.recRes, ICO.ticket, 'Recorde de reservas', v => `${int(v)} reserva${v === 1 ? '' : 's'}`, 'res'),
      selo(ICO.chama, '3 ciclos seguidos vendendo', C.melhorSeq >= 3,
        C.melhorSeq >= 3 ? `Melhor sequência: ${C.melhorSeq} ciclos` : `${C.seqAtual} de 3 ciclos seguidos`, C.melhorSeq >= 3 ? null : C.seqAtual / 3),
      selo(ICO.coroa, 'Creator destaque do mês', C.destaques.length > 0,
        C.destaques.length ? `${C.destaques.length}× · último em ${C.destaques[C.destaques.length - 1].nome}`
          : C.posAtual ? `${ord(C.posAtual.pos)} lugar no ciclo atual` : 'Lidere o ranking de um ciclo fechado',
        null, C.destaques.length > 0 && C.destaques[C.destaques.length - 1].id === listaCiclos()[1]?.id),
    ];
    const ok = S.filter(s => s.ok).length;
    $('cont-conq').textContent = `${ok} de ${S.length} conquistadas`;

    const fat = C.recFat.melhor, res = C.recRes.melhor;
    $('stats').innerHTML = [
      ['Posição no ciclo atual', C.posAtual ? `${ord(C.posAtual.pos)}<small>de ${C.posAtual.total}</small>` : '—', A.nome],
      ['Recorde de faturamento', fat ? brlBig(fat.receita).replace('<small>', '<small class="pre">') : '—', fat ? fat.nome : 'Sem vendas ainda'],
      ['Recorde de reservas', res ? `${int(res.res)}<small>reserva${res.res === 1 ? '' : 's'}</small>` : '—', res ? res.nome : 'Sem vendas ainda'],
      ['Sequência atual', `${int(C.seqAtual)}<small>ciclo${C.seqAtual === 1 ? '' : 's'}</small>`, `Melhor: ${int(C.melhorSeq)} ciclo${C.melhorSeq === 1 ? '' : 's'} seguidos`],
    ].map(([l, v, s]) => `<div class="stat"><div class="l">${l}</div><div class="v num">${v}</div><div class="s">${esc(s)}</div></div>`).join('');

    $('selos').innerHTML = S.map(s => `<div class="selo${s.ok ? '' : ' off'}${s.novo ? ' novo' : ''}">
      ${s.novo ? '<span class="tag">Novo</span>' : ''}<div class="md">${s.ico}</div>
      <div class="nm">${esc(s.nm)}</div><div class="ds">${esc(s.ds)}</div>
      ${s.prog !== null ? `<div class="prog"><i style="width:${Math.min(100, s.prog * 100).toFixed(1)}%"></i></div>` : ''}
    </div>`).join('');
  }

  function renderDestaques() {
    const RC = D.ranking_ciclos || {};
    const cards = listaCiclos().slice(1, 7).filter(c => RC[c.id]?.length).map(c => {
      const nome = RC[c.id][0];
      const r = resumo(D.reservas.filter(x => x.parceiro === nome && x.criado >= c.ini && x.criado <= c.fim));
      return `<button type="button" class="dst" data-parc="${esc(nome)}"><span class="md">${ICO.coroa}</span>
        <span style="min-width:0"><div class="x">${c.nome}</div><div class="nm">${esc(nome)}</div>
        <div class="s num">${brl(r.com)} · ${int(r.res)} reserva${r.res === 1 ? '' : 's'}</div></span></button>`;
    });
    $('dest').innerHTML = cards.length ? cards.join('') : '<div class="vazio">Nenhum ciclo fechado com vendas ainda.</div>';
  }

  function renderCiclos() {
    const cs = listaCiclos().slice(0, 8).reverse();
    const vals = cs.map(c => resumo(doPeriodo(c.ini, c.fim)).com);
    const max = Math.max(1, ...vals);
    const curto = v => v >= 1000 ? 'R$ ' + (v / 1000).toLocaleString('pt-BR', {maximumFractionDigits: 1}) + 'k' : 'R$ ' + nBR(v, 0);
    $('chart').innerHTML = vals.some(v => v) ? `<div class="bars">${cs.map((c, i) => `
      <div class="bar${c.id === F.ciclo ? ' cur' : ''}" title="${c.nome}: ${brl(vals[i])}">
        <div class="t num">${vals[i] ? curto(vals[i]) : ''}</div>
        <div class="col" style="height:${(vals[i] / max * 100).toFixed(1)}%"></div>
        <div class="x">${c.curto}</div>
      </div>`).join('')}</div>` : '<div class="vazio">Sem comissões nos últimos ciclos.</div>';
  }

  // Ponte para conteudos.js (Biblioteca de posts)
  window.PV = {
    $, esc, nBR, int, pctTxt, dBR, ICO, iniciais, listaCiclos, cicloId, pad,
    get D() { return D; },
    get login() { return loginAtual; },
    get chave() { return chaveAtual; },
    get parceiro() { return F.parceiro; },
    get filtro() { return {ciclo: F.ciclo, ini: F.ini, fim: F.fim}; },
    setParceiro(nome) { F.parceiro = nome; $('sel-parceiro').value = nome; render(); },
    recarregar, recarregarPagina,
  };

  restaurarSessao();
})();
</script>
<script>
  // Scripts com a mesma versão da URL (?v=…): depois do recarregamento automático vêm sem cache
  const V = new URLSearchParams(location.search).get('v') || '1';
  for (const f of ['conteudos.js', 'painel.js']) document.write(`<script src="${f}?v=${encodeURIComponent(V)}"><\/script>`);
</script>
</body>
</html>
