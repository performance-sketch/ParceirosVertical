name: Receber post de creator

# Disparado pelo cenário do Make (repository_dispatch) quando um creator envia um link no portal.
# Caminho rápido num único job e num único commit (= uma única publicação do Pages):
# grava o envio, coleta o post e atualiza só a biblioteca nos dados publicados, sem consultar o Rezdy.
# Se outro job publicar antes (push recusado), refaz tudo sobre a versão mais nova do main.
on:
  repository_dispatch:
    types: [novo-post]

jobs:
  processar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Registrar, coletar e publicar
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          PARCEIROS_SENHAS: ${{ secrets.PARCEIROS_SENHAS }}
          PAGAMENTOS_CHAVE: ${{ secrets.PAGAMENTOS_CHAVE }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          gravar_envio() {
            python3 - <<'EOF'
          import hashlib, json, os, pathlib
          p = json.loads(os.environ["PAYLOAD"] or "{}")
          campos = {k: str(p.get(k, ""))[:500] for k in ("signer", "login", "url", "tipo", "ts", "sig")}
          nome = hashlib.sha256(json.dumps(campos, sort_keys=True).encode()).hexdigest()[:16]
          d = pathlib.Path("instagram/inbox"); d.mkdir(parents=True, exist_ok=True)
          (d / f"{nome}.json").write_text(json.dumps(campos))
          print("envio de", campos["login"], campos["url"])
          EOF
          }
          for tentativa in 1 2 3 4 5; do
            gravar_envio
            python scripts/instagram_sync.py
            python scripts/build_data.py --somente-posts
            git add -A data instagram financeiro
            git diff --cached --quiet && exit 0
            git commit -q -m "chore: novo post na biblioteca [skip ci]"
            git push -q && exit 0
            echo "main mudou durante o processamento — refazendo sobre a versão nova (tentativa $tentativa)"
            git fetch -q origin main && git reset -q --hard origin/main
            sleep $((tentativa * 2))
          done
          # Último recurso: guarda só o envio; a atualização automática (update.yml) processa em até 15 min
          gravar_envio
          git add instagram/inbox && git commit -q -m "chore: novo post na caixa de entrada [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 3; done
          exit 1
