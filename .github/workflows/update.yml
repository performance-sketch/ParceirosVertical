name: Atualizar dados dos parceiros

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [config.json, 'scripts/**', requirements.txt]

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # Um envio de post (receber-post.yml) pode publicar enquanto este job roda. Se o push for
      # recusado, refaz a geração sobre a versão mais nova do main em vez de mesclar arquivos criptografados.
      - name: Coletar posts, buscar reservas no Rezdy, gerar dados criptografados e publicar
        env:
          REZDY_API_KEY: ${{ secrets.REZDY_API_KEY }}
          PARCEIROS_SENHAS: ${{ secrets.PARCEIROS_SENHAS }}
          PAGAMENTOS_CHAVE: ${{ secrets.PAGAMENTOS_CHAVE }}
          META_IG_TOKEN: ${{ secrets.META_IG_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for tentativa in 1 2 3 4; do
            python scripts/instagram_sync.py
            python scripts/build_data.py
            git add -A data instagram financeiro
            git diff --cached --quiet && exit 0
            git commit -q -m "chore: atualiza dados dos parceiros [skip ci]"
            git push -q && exit 0
            echo "main mudou durante a geração — refazendo sobre a versão nova (tentativa $tentativa)"
            git fetch -q origin main && git reset -q --hard origin/main
            sleep $((tentativa * 3))
          done
          exit 1
